# Real Promtail config: discovers every container in this compose
# network via the real Docker socket (docker_sd_configs — Promtail's own
# documented mechanism, not a custom log-shipping shim) and ships their
# real stdout/stderr to Loki. compose_project/compose_service come
# straight from the labels Docker Compose already sets on every
# container it creates, so log lines are queryable per real service
# (e.g. {compose_service="validator2"}) with no extra tagging step.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
