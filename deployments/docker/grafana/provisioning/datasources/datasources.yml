# Real Grafana datasource provisioning — both point at real services in
# the same compose network (prometheus/loki, see docker-compose.yml),
# not placeholders. Grafana loads this on startup, so both datasources
# exist without any manual click-through setup.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
