# Tells Grafana to auto-load every dashboard JSON file under
# /var/lib/grafana/dashboards (mounted from
# deployments/docker/grafana/dashboards/ — see docker-compose.yml) on
# startup, so the real ShadowForge dashboard exists without any manual
# import step.
apiVersion: 1

providers:
  - name: shadowforge
    orgId: 1
    folder: ShadowForge
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
