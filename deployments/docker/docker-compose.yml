# Phase 2 multi-node verification network (spec 6: "Multi-node
# verification in Phase 2 of the development plan is a Docker compose of
# at least four nodes: two civilian validators, one sentinel candidate,
# one client wallet simulator.")
#
# Peer discovery: libp2p peer IDs are generated fresh per container start,
# so bootstrap addresses can't be hardcoded. Each node/simulator that
# listens writes its dialable multiaddr to a shared volume
# (-announce-file, published as soon as the host starts listening, before
# it waits on anyone else's file — see cmd/node/main.go); everyone else
# waits for that file (-bootstrap-file, comma-separated for more than one)
# before dialing.
#
# The three validator-role nodes (validator1, validator2, sentinel1) are
# wired as a full mesh, not a star through validator1: pkg/validator's
# real BFT consensus (spec 5.7) needs every node to agree on the same
# observed online set to compute the same deterministic committee
# (pkg/consensus.AssignCommittee), and this reference build does not
# relay heartbeats, proposals, or votes beyond directly connected peers —
# a star topology would let each node's online view permanently diverge,
# and committees (and therefore quorum) would never agree. Wallet clients
# like walletsim are not part of the validator committee and only need
# one entry point, so they stay star-connected to a single validator.
#
# Run: docker compose -f deployments/docker/docker-compose.yml up --build
# Then:
#   - http://localhost:8090  block explorer (Phase 3's roadmap item) — a
#     static page that runs entirely in your browser and talks directly
#     to validator2's published query API (http://localhost:8081, see
#     validator2's -query-listen/ports below), so nothing about it needs
#     to run inside the compose network itself.
#   - http://localhost:8096  validator-NFT mint page (cmd/mintpage) — the
#     real spec-10.1 mint flow (identity, proof-of-humanity attestation,
#     mint) as a web UI instead of the 'wallet' CLI. Its bootstrap peer is
#     prefilled from validator1's own announce file, same mechanism as
#     every other service here. Minting only matters for real once at
#     least one node trusts a real attestor key (-poh-attestor-keys,
#     see validator1/validator2/sentinel1's commands below) — every
#     validator-role node here runs with -skip-nft-check for smoke-test
#     speed, so this network doesn't require a real mint before a node
#     joins consensus; add a real -poh-attestor-keys and drop
#     -skip-nft-check on the nodes you want to actually enforce it.
#   - http://localhost:3000  Grafana (admin/admin on first login) — the
#     "ShadowForge L1 — Real Node Metrics" dashboard is pre-provisioned
#     (deployments/docker/grafana/), real Prometheus metrics on the left,
#     real aggregated container logs (via Loki/Promtail) at the bottom.
#   - http://localhost:9090  Prometheus's own UI, if you want to run ad
#     hoc queries against the same real metrics Grafana graphs.
#   - http://localhost:8095  status page (cmd/statuspage) — this
#     container itself polls validator1/validator2/sentinel1's real
#     /v1/status every 15s and renders real, persisted uptime history
#     (statuspage_data volume), unlike the explorer's browser-direct
#     design: uptime has to be observed continuously by something that
#     keeps running whether or not anyone has the page open.
# Every validator-role node publishes its own real Prometheus metrics
# (pkg/metrics) on :9100, which prometheus/prometheus.yml scrapes; every
# container's real stdout/stderr is shipped to Loki by promtail via the
# Docker socket (no logging-driver changes needed on any service).
services:
  validator1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/node"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -announce-file=/shared/validator1.addr
      - -skip-zk-setup # keep the 4-node smoke test fast; omit to exercise real Transfer proofs
      - -validate # opt into real heartbeating/committee eligibility (spec 5.4/243) — off by default now
      - -skip-nft-check # this smoke network mints no real ValidatorNFTs; skip that gate here, same spirit as -skip-zk-setup above
      # 0.0.0.0, not the loopback-only default: statuspage (another
      # container on this same network) needs to reach it. Not published
      # to the host (no ports: entry) — nothing outside this compose
      # network needs it, unlike validator2's own identical choice below.
      - -query-listen=0.0.0.0:8081
      - -metrics-listen=0.0.0.0:9100
    volumes:
      - shared:/shared

  validator2:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/node"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -bootstrap-file=/shared/validator1.addr,/shared/sentinel1.addr
      - -announce-file=/shared/validator2.addr
      - -skip-zk-setup
      - -validate
      - -skip-nft-check
      # 0.0.0.0, not the -query-listen default's loopback-only bind: this
      # is validator2's own explicit choice to publish its read-only
      # query API (see pkg/query.Config.ListenAddr's own doc) — both to
      # the host (via ports: below, for the explorer's browser-side
      # fetches) and, incidentally, to its sibling containers.
      - -query-listen=0.0.0.0:8081
      - -metrics-listen=0.0.0.0:9100
    ports:
      - "8081:8081"
    volumes:
      - shared:/shared
    depends_on:
      - validator1
      - sentinel1

  sentinel1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/node"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -bootstrap-file=/shared/validator1.addr
      - -announce-file=/shared/sentinel1.addr
      - -sentinel
      - -skip-zk-setup
      # -validate is meaningless combined with -sentinel (see -validate's own
      # doc); no peer here configures -sentinel-keys for this node's identity,
      # so its IsSentinel claim isn't trusted and it still needs -skip-nft-check
      # to be counted online, same as validator1/validator2 above.
      - -skip-nft-check
      # Same reasoning as validator1's identical addition above.
      - -query-listen=0.0.0.0:8081
      - -metrics-listen=0.0.0.0:9100
    volumes:
      - shared:/shared
    depends_on:
      - validator1

  walletsim:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/walletsim"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4010
      - -bootstrap-file=/shared/validator2.addr
      - -interval=3s
    volumes:
      - shared:/shared
    depends_on:
      - validator2

  explorer:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/explorer"]
    command:
      - -listen=0.0.0.0:8090
      # A host-visible address, not validator2's in-network service name:
      # -query's default reaches a viewer's own browser, which runs on
      # the host, not inside this compose network (see cmd/explorer's own
      # doc — nothing here proxies the API, so this has to be an address
      # the browser itself can dial).
      - -query=http://localhost:8081
    ports:
      - "8090:8090"
    depends_on:
      - validator2

  mintpage:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/mintpage"]
    command:
      - -listen=0.0.0.0:8096
      - -default-bootstrap-file=/shared/validator1.addr
      # Host-visible, not the in-network service name: like explorer's own
      # -query above, this is fetched by a viewer's browser, which runs on
      # the host, not inside this compose network.
      - -default-query=http://localhost:8081
    ports:
      - "8096:8096"
    volumes:
      - shared:/shared
    depends_on:
      - validator1
      - validator2

  # --- Monitoring & log aggregation (Phase 3's "hosting, monitoring, log
  # aggregation, status page" roadmap item) ---

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - validator1
      - validator2
      - sentinel1

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.1.0
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only access to the real Docker socket is how promtail's own
      # documented docker_sd_configs discovers and tails every sibling
      # container's real stdout/stderr — no logging-driver change needed
      # on validator1/validator2/sentinel1/walletsim/explorer themselves.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  statuspage:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/statuspage"]
    command:
      - -listen=0.0.0.0:8095
      # In-network service names, unlike the explorer's -query (that one
      # reaches a viewer's browser; this one is polled by this container
      # itself — see cmd/statuspage's own doc on why it needs a real,
      # continuously-running poller rather than the explorer's
      # browser-direct-fetch design).
      - -nodes=validator1=http://validator1:8081,validator2=http://validator2:8081,sentinel1=http://sentinel1:8081
      - -data=/data/statuspage.json
      - -interval=15s
    ports:
      - "8095:8095"
    volumes:
      - statuspage_data:/data
    depends_on:
      - validator1
      - validator2
      - sentinel1

volumes:
  shared:
  prometheus_data:
  loki_data:
  grafana_data:
  statuspage_data:
