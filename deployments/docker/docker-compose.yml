# Phase 2 multi-node verification network (spec 6: "Multi-node
# verification in Phase 2 of the development plan is a Docker compose of
# at least four nodes: two civilian validators, one sentinel candidate,
# one client wallet simulator.")
#
# Peer discovery: libp2p peer IDs are generated fresh per container start,
# so bootstrap addresses can't be hardcoded. Each node/simulator that
# listens writes its dialable multiaddr to a shared volume
# (-announce-file, published as soon as the host starts listening, before
# it waits on anyone else's file — see cmd/node/main.go); everyone else
# waits for that file (-bootstrap-file, comma-separated for more than one)
# before dialing.
#
# The three validator-role nodes (validator1, validator2, sentinel1) are
# wired as a full mesh, not a star through validator1: pkg/validator's
# real BFT consensus (spec 5.7) needs every node to agree on the same
# observed online set to compute the same deterministic committee
# (pkg/consensus.AssignCommittee), and this reference build does not
# relay heartbeats, proposals, or votes beyond directly connected peers —
# a star topology would let each node's online view permanently diverge,
# and committees (and therefore quorum) would never agree. Wallet clients
# like walletsim are not part of the validator committee and only need
# one entry point, so they stay star-connected to a single validator.
#
# Run: docker compose -f deployments/docker/docker-compose.yml up --build
# Then open http://localhost:8090 for the block explorer (Phase 3's
# roadmap item) — it's a static page that runs entirely in your browser
# and talks directly to validator2's published query API
# (http://localhost:8081, see validator2's -query-listen/ports below),
# so nothing about it needs to run inside the compose network itself.
services:
  validator1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/node"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -announce-file=/shared/validator1.addr
      - -skip-zk-setup # keep the 4-node smoke test fast; omit to exercise real Transfer proofs
    volumes:
      - shared:/shared

  validator2:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/node"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -bootstrap-file=/shared/validator1.addr,/shared/sentinel1.addr
      - -announce-file=/shared/validator2.addr
      - -skip-zk-setup
      # 0.0.0.0, not the -query-listen default's loopback-only bind: this
      # is validator2's own explicit choice to publish its read-only
      # query API (see pkg/query.Config.ListenAddr's own doc) — both to
      # the host (via ports: below, for the explorer's browser-side
      # fetches) and, incidentally, to its sibling containers.
      - -query-listen=0.0.0.0:8081
    ports:
      - "8081:8081"
    volumes:
      - shared:/shared
    depends_on:
      - validator1
      - sentinel1

  sentinel1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/node"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4001
      - -bootstrap-file=/shared/validator1.addr
      - -announce-file=/shared/sentinel1.addr
      - -sentinel
      - -skip-zk-setup
    volumes:
      - shared:/shared
    depends_on:
      - validator1

  walletsim:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/walletsim"]
    command:
      - -listen=/ip4/0.0.0.0/tcp/4010
      - -bootstrap-file=/shared/validator2.addr
      - -interval=3s
    volumes:
      - shared:/shared
    depends_on:
      - validator2

  explorer:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/usr/local/bin/explorer"]
    command:
      - -listen=0.0.0.0:8090
      # A host-visible address, not validator2's in-network service name:
      # -query's default reaches a viewer's own browser, which runs on
      # the host, not inside this compose network (see cmd/explorer's own
      # doc — nothing here proxies the API, so this has to be an address
      # the browser itself can dial).
      - -query=http://localhost:8081
    ports:
      - "8090:8090"
    depends_on:
      - validator2

volumes:
  shared:
